# ════════════════════════════════════════════════════════════════
# GalaxyOS v10 — CNB 云原生构建配置
#
# 策略：Dockerfile.ci 预装全部依赖 → Docker layer 缓存 → CI 秒级启动
#
# v10 变更（相对 v9.4）：
#   - harness-import-check: sidecar_bridge.py 已删，只验 create_galaxy_agent
#   - 删 desktop-shell-import-check（desktop-shell/ 目录已不存在）
#   - 删 llm-provider-test job（test_llm_providers/sidecar_set_config/
#     harness_sidecar_bridge 三个测试文件已在 v10 重构中删除）
#   - secret-scan: 去掉 services/ desktop-shell/（已不存在）
#   - pytest 忽略列表: 去掉已删除的 test_memgas_skvm / test_memory_consolidation
#     / test_nlp_enhanced，保留仍存在但需要外部资源的测试
#   - 删 $:tag_push 整段（desktop-shell/ + lfm_server 在 v10 已不存在，
#     arm64 打包交由 GitHub Actions release.yml 处理）
# ════════════════════════════════════════════════════════════════


# ── main 分支：完整测试 ──
main:
  push:
    # Python 全量测试（用预构建镜像，依赖已缓存）
    - name: python-test
      docker:
        build:
          dockerfile: Dockerfile.ci
          by:
            - Dockerfile.ci
            - .cnb.yml
      stages:
        - name: compile-check
          script: |
            python -c "
            import py_compile, os, sys
            problems = []
            for root, dirs, files in os.walk('.'):
                dirs[:] = [d for d in dirs if d not in ('node_modules', '.git', '__pycache__', 'target', 'prebuilt')]
                for f in files:
                    if f.endswith('.py'):
                        path = os.path.join(root, f)
                        try: py_compile.compile(path, doraise=True)
                        except py_compile.PyCompileError: problems.append(path)
            if problems:
                print(f'FAILED: {len(problems)} files')
                for p in problems: print(f'  {p}')
                sys.exit(1)
            print(f'OK: all Python files compile on {sys.version}')
            "
        - name: pytest
          script: |
            python -m pytest tests/ -v --tb=short -p no:warnings \
              --ignore=tests/test_cognitive_map.py \
              --ignore=tests/test_chain_of_verification.py \
              --ignore=tests/test_thinking_enhanced.py \
              --ignore=tests/test_emotion_memory.py \
              --ignore=tests/test_context_compressor.py \
              --ignore=tests/test_rag_optimizer.py \
              --ignore=tests/test_biorhythm_sleep.py \
              --ignore=tests/test_imports.py
        - name: harness-import-check
          script: |
            # v10 harness 入口必须能 import（不要求 key）
            python -c "
            from galaxyos.harness import create_galaxy_agent
            print('OK: harness importable')
            "

    # Secret 扫描（轻量，并行）
    - name: secret-scan
      docker:
        image: python:3.12
      stages:
        - name: hardcoded-keys
          script: |
            FOUND=0
            grep -rPn 'sk-[a-zA-Z0-9]{20,}' extensions/ galaxyos/ scripts/ tests/ 2>/dev/null && FOUND=1
            grep -rPn '(ghp_|gho_|cnb_)[a-zA-Z0-9]{20,}' extensions/ galaxyos/ scripts/ tests/ 2>/dev/null && FOUND=1
            [ "$FOUND" -ne 0 ] && echo "FOUND secrets" && exit 1
            echo "OK: no hardcoded secrets"

  pull_request:
    - name: pr-test
      docker:
        build:
          dockerfile: Dockerfile.ci
          by:
            - Dockerfile.ci
            - .cnb.yml
      stages:
        - name: compile-check
          script: |
            python -c "
            import py_compile, os, sys
            problems = []
            for root, dirs, files in os.walk('.'):
                dirs[:] = [d for d in dirs if d not in ('node_modules', '.git', '__pycache__', 'target', 'prebuilt')]
                for f in files:
                    if f.endswith('.py'):
                        path = os.path.join(root, f)
                        try: py_compile.compile(path, doraise=True)
                        except py_compile.PyCompileError: problems.append(path)
            if problems:
                print(f'FAILED: {len(problems)} files')
                sys.exit(1)
            print('OK: compile check passed')
            "
        - name: pytest
          script: |
            python -m pytest tests/ -v --tb=short -p no:warnings \
              --ignore=tests/test_cognitive_map.py \
              --ignore=tests/test_chain_of_verification.py \
              --ignore=tests/test_thinking_enhanced.py \
              --ignore=tests/test_emotion_memory.py \
              --ignore=tests/test_context_compressor.py \
              --ignore=tests/test_rag_optimizer.py \
              --ignore=tests/test_biorhythm_sleep.py \
              --ignore=tests/test_imports.py


# ── Tag 推送 ──
#
# v10 起 tag_push 暂时禁用：
#   - 原 v9.4 的 arm64 打包依赖 desktop-shell/（Electron + PyInstaller sidecar），
#     该目录在 v10 重构中已删除。
#   - Windows x64 + Linux x64 桌面端打包全部交由 GitHub Actions
#     (.github/workflows/release.yml) 处理，CNB 不再重复。
#   - 如需在 CNB 恢复 arm64 打包，需先在 v10 代码树中重建对应的
#     sidecar spec + electron-builder 配置，再在此添加 tag_push 段。
